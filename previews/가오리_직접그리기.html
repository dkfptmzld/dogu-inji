let lines=[],cur=null;
function draw(){g.drawImage(img,0,0,c.width,c.height); g.lineCap='round'; g.lineJoin='round';
 for(const l of lines.concat(cur?[cur]:[])){ if(l.length<2)continue;
  for(const [w,col] of [[14,'#fff'],[7,'#e21e28']]){g.lineWidth=w; g.strokeStyle=col; g.beginPath(); l.forEach((p,i)=>i?g.lineTo((p[0]-X0)*S,(p[1]-Y0)*S):g.moveTo((p[0]-X0)*S,(p[1]-Y0)*S)); g.stroke();} } }
img.onload=draw;
function pos(e){const r=c.getBoundingClientRect(); return [Math.round(X0+(e.clientX-r.left)/r.width*W), Math.round(Y0+(e.clientY-r.top)/r.height*H)];}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId); cur=[pos(e)]; draw();});
c.addEventListener('pointermove',e=>{if(!cur)return; cur.push(pos(e)); draw();});
const end=()=>{if(cur&&cur.length>1)lines.push(cur); cur=null; draw();};
c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
document.getElementById('undo').onclick=()=>{lines.pop(); draw();};
document.getElementById('clear').onclick=()=>{lines=[]; draw();};
document.getElementById('save').onclick=()=>{
 if(!lines.length){document.getElementById('msg').textContent='아직 그린 선이 없어요.';return;}
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({animal:'3번 가오리',lines})],{type:'application/json'}));
 a.download='가오리_테두리.json'; a.click();
 document.getElementById('msg').textContent='저장했어요! 내려받기 폴더의 "가오리_테두리.json" 파일이 생겼어요. Claude에게 "저장했어"라고 알려 주세요.';
