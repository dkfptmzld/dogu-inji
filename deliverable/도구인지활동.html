<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도구인지 활동</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #1f2a37;
    --muted: #6b7280;
    --accent: #e8743b;
    --accent-dark: #c85a24;
    --accent-soft: #fdeee4;
    --line: #e5e0d5;
    --shadow: 0 6px 20px rgba(31, 42, 55, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ════════ 목록 화면 ════════ */
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(244, 241, 234, 0.94); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 18px 48px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 84px; height: 84px; display: block; }
  .brand .org { font-size: 17px; font-weight: 800; color: #3f8f4a; letter-spacing: 0.5px; }
  header h1 { font-size: 42px; font-weight: 900; letter-spacing: -1px; line-height: 1.15; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 19px; margin-top: 2px; }
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .count { font-size: 18px; font-weight: 800; color: var(--ink); }
  .legend { display: flex; gap: 16px; font-size: 16px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display: block; }

  #menu { padding: 28px 48px 56px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
    gap: 18px;
  }
  .group {
    background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); padding: 12px;
    display: grid; grid-template-columns: 88px 1fr 1fr; gap: 12px; align-items: stretch;
  }
  .wkbadge {
    border-radius: 16px; background: var(--ink); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1;
  }
  .wkbadge b { font-size: 40px; font-weight: 900; }
  .wkbadge small { font-size: 17px; font-weight: 800; margin-top: 6px; opacity: .8; }
  .prog {
    display: flex; align-items: center; gap: 14px;
    background: #f7f5f0; border: 3px solid transparent;
    border-radius: 16px; padding: 16px; min-height: 104px;
    text-align: left; color: var(--ink);
    transition: border-color .15s, transform .15s, background .15s;
  }
  .prog.ready { background: var(--accent-soft); }
  .prog:hover, .prog:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .prog .play {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
    background: #c9c2b4; display: flex; align-items: center; justify-content: center;
  }
  .prog.ready .play { background: var(--accent); }
  .prog .play::after {
    content: ""; margin-left: 4px;
    border-left: 15px solid #fff;
    border-top: 10px solid transparent; border-bottom: 10px solid transparent;
  }
  .prog .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .prog .name { font-size: 25px; font-weight: 800; line-height: 1.25; word-break: keep-all; }
  .prog .sub { font-size: 16px; font-weight: 700; color: #a39b8b; }
  .prog.ready .sub { color: var(--accent-dark); }
  .prog .no { font-size: 15px; font-weight: 800; color: var(--muted); }

  /* ════════ 슬라이드 화면 ════════ */
  #show {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    flex-direction: column;
  }
  #show.on { display: flex; }

  .show-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 24px;
  }
  .brand-mini { display: flex; align-items: center; gap: 12px; }
  .brand-mini img { width: 44px; height: 44px; display: block; }
  .show-top .where { font-size: 18px; font-weight: 800; color: var(--accent-dark); }
  .show-top .where b { color: var(--ink); margin-left: 6px; }

  .slide-wrap { flex: 1; min-height: 0; padding: 0 24px; display: flex; }
  .slide {
    flex: 1; min-height: 0;
    background: var(--panel); border-radius: 24px; box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
    animation: fade .35s ease;
    cursor: pointer;
  }
  @keyframes fade { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

  /* 표지 슬라이드 */
  .cover {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px; gap: 18px;
    background: linear-gradient(160deg, #fff 0%, #fdeee4 100%);
  }
  .cover .wk {
    font-size: 26px; font-weight: 800; color: #fff; background: var(--accent);
    padding: 6px 22px; border-radius: 999px;
  }
  .cover h2 { font-size: clamp(48px, 8vw, 110px); font-weight: 900; letter-spacing: -2px; line-height: 1.1; }
  .cover .items { margin-top: 10px; font-size: clamp(20px, 2.2vw, 30px); color: var(--muted); }
  .cover .items strong { color: var(--ink); }
  .cover .hint { margin-top: 24px; font-size: 18px; color: #b0a99a; }

  /* 단계 슬라이드 */
  .step-media {
    flex: 1; min-height: 0; background: #f6f4ee; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .step-media video { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* 글자 슬라이드 (네 글자 이어 말하기): 사진 카드처럼 검은 테두리 주황 글씨 + 길쭉한 ○○ */
  /* 동그라미 굵기·테두리를 글자 크기(--fs)에 맞춰 계산 → 글자 획과 같은 굵기 */
  .bigword { --fs: min(24vw, 46vh); display: flex; align-items: center; justify-content: center; gap: 1.2vw; background: #fff; width: 100%; height: 100%; }
  .bigword .ch {
    font-size: var(--fs); font-weight: 900; line-height: 1; color: #ef8a4c;
    -webkit-text-stroke: calc(var(--fs) * 0.036) #1d1d1d; paint-order: stroke fill;
    display: inline-block; transform: scaleX(0.82); margin: 0 -1.2vw;
  }
  /* 초성 슬라이드: 카드처럼 검은 굵은 글자 */
  .bigword.cho { gap: 3vw; }
  .bigword.cho .ch { color: #1d1d1d; -webkit-text-stroke: 0; transform: none; margin: 0; }
  /* 그림 슬라이드 */
  .step-media .stepimg { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .bigword .ring {
    width: calc(var(--fs) * 0.74); height: calc(var(--fs) * 0.74); border-radius: 50%; box-sizing: border-box;   /* 완전한 동그라미 */
    border: calc(var(--fs) * 0.105) solid #ef8a4c;                   /* 글자 세로획 굵기와 같게 */
    outline: calc(var(--fs) * 0.018) solid #1d1d1d;                  /* 글자 검은 테두리와 같게 */
    box-shadow: inset 0 0 0 calc(var(--fs) * 0.018) #1d1d1d;
    margin: 0 1vw;
  }
  .step-media .stepno {
    position: absolute; top: 18px; left: 18px;
    background: var(--accent); color: #fff; font-weight: 900;
    font-size: 24px; padding: 8px 20px; border-radius: 999px;
  }
  .no-clip {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: #94a3b8; text-align: center; padding: 24px; background: #14181f;
  }
  .no-clip strong { font-size: 26px; color: #e2e8f0; }
  .no-clip code { background: #1f2937; color: #cbd5e1; padding: 4px 12px; border-radius: 8px; font-size: 17px; }
  .caption {
    padding: 22px 32px; text-align: center;
    font-size: clamp(26px, 3.2vw, 46px); font-weight: 800; line-height: 1.35;
    border-top: 6px solid var(--accent);
  }
  .caption.placeholder { color: #b0a99a; }

  /* 하단 조작부 */
  .show-bottom {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 24px 18px;
  }
  .btn {
    background: var(--panel); color: var(--ink);
    border: 2px solid var(--line); border-radius: 14px;
    font-size: 20px; font-weight: 800; padding: 12px 24px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .35; cursor: default; }
  .center { display: flex; align-items: center; gap: 14px; }
  .dots { display: flex; gap: 8px; align-items: center; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #d6cfc1; display: block; }
  .dots i.on { background: var(--accent); width: 32px; border-radius: 999px; }
  .pageno { font-size: 20px; font-weight: 800; min-width: 64px; text-align: center; }
  .side { display: flex; gap: 10px; }

  @media (max-width: 900px) {
    header, #menu { padding-left: 16px; padding-right: 16px; }
    header h1 { font-size: 30px; }
    .brand img { width: 60px; height: 60px; }
    .head-right { align-items: flex-start; }
    .grid { grid-template-columns: 1fr; }
    .group { grid-template-columns: 1fr; }
    .wkbadge { flex-direction: row; gap: 4px; padding: 8px; }
    .wkbadge b { font-size: 24px; } .wkbadge small { margin-top: 0; }
    .show-top .brand-mini img { display: none; }
    .slide-wrap, .show-top, .show-bottom { padding-left: 12px; padding-right: 12px; }
    .btn { font-size: 16px; padding: 10px 14px; white-space: nowrap; }
    .dots { display: none; }
    .show-bottom { gap: 8px; }
    .show-bottom > div:last-child { display: none; }   /* 오른쪽 빈 칸 → 휴대폰에선 버튼 자리로 */
    .center { gap: 8px; }
    .pageno { min-width: 44px; font-size: 17px; }
  }
</style>
</head>

/* 활동이 아직 없는 프로그램에 보여줄 빈 칸 수 */
const EMPTY_STEPS = 3;

/* ───────── 아래는 수정하지 않아도 됩니다 ───────── */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

const PROGRAMS = [];
WEEKS.forEach((pair, w) => pair.forEach((title, k) => {
  const key = (w + 1) + "-" + (k + 1);
  const d = DETAILS[key] || {};
  const folder = "videos/" + pad(w + 1) + "-" + (k + 1) + "/";
  let steps = (d.steps || []).map((s, n) =>
    typeof s === "string" ? { text: s, clip: folder + (n + 1) + ".mp4" }
                          : { text: s.text || "", label: s.label, word: s.word, img: s.img, cho: s.cho, sound: !!s.sound, once: !!s.once, clip: s.clip || folder + (n + 1) + ".mp4" });
  const empty = !steps.length;
  if (empty) steps = Array.from({ length: EMPTY_STEPS }, (_, n) =>
    ({ text: "", clip: folder + (n + 1) + ".mp4" }));
  PROGRAMS.push({ week: w + 1, order: k + 1, title, items: d.items || [], steps, empty });
}));

let cur = 0;    // 현재 프로그램
let page = 0;   // 0 = 표지, 1.. = 활동

/* ── 목록 ── */
function renderMenu() {
  const ready = PROGRAMS.filter(p => !p.empty).length;
  $("count").textContent = "총 " + PROGRAMS.length + "개 프로그램 · 영상 준비 " + ready + "개";
  $("logo2").src = $("logo").src;
  const grid = $("grid");
  WEEKS.forEach((pair, w) => {
    const g = document.createElement("section");
    g.className = "group";
    g.innerHTML = '<div class="wkbadge"><b>' + (w + 1) + '</b><small>주차</small></div>';
    pair.forEach((title, k) => {
      const i = w * 2 + k, prog = PROGRAMS[i];
      const b = document.createElement("button");
      b.className = "prog" + (prog.empty ? "" : " ready"); b.id = "prog" + i;
      b.innerHTML = '<span class="play"></span><span class="txt"><span class="no">' + (k + 1) +
        '번째 프로그램</span><span class="name"></span><span class="sub"></span></span>';
      b.querySelector(".name").textContent = title;
      b.querySelector(".sub").textContent = prog.empty ? "준비 중" : "활동 " + prog.steps.length + "개";
      b.onclick = () => openProgram(i, 0);
      g.appendChild(b);
    });
    grid.appendChild(g);
  });
}

/* ── 슬라이드 ── */
function openProgram(i, p) {
  cur = i; page = p;
  $("menuView").style.display = "none";
  $("show").classList.add("on");
  renderSlide();
}

function totalPages(prog) { return prog.steps.length + 1; }

// 휴대폰용 파일은 영상이 HTML 안에 들어 있음(window.EMBED). 있으면 그걸 쓰고, 없으면 videos 폴더에서 읽음.
const blobCache = {};
function clipUrl(p) {
  const b64 = window.EMBED && window.EMBED[p];
  if (!b64) return p;
  if (!blobCache[p]) {
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    blobCache[p] = URL.createObjectURL(new Blob([arr], { type: /\.jpe?g$/i.test(p) ? "image/jpeg" : "video/mp4" }));
  }
  return blobCache[p];
}

function renderSlide() {
  const prog = PROGRAMS[cur];
  const total = totalPages(prog);
  const slide = $("slide");

  // 기존 영상 정리
  slide.querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
  slide.innerHTML = "";
  slide.style.animation = "none"; void slide.offsetWidth; slide.style.animation = "";

  $("where").innerHTML = prog.week + "주차 <b></b>";
  $("where").querySelector("b").textContent = prog.title;

  if (page === 0) {
    const c = document.createElement("div");
    c.className = "cover";
    c.innerHTML = '<div class="wk">' + prog.week + '주차</div><h2></h2>' +
      '<div class="items"></div><div class="hint">다음을 누르면 시작해요</div>';
    c.querySelector("h2").textContent = prog.title;
    const it = c.querySelector(".items");
    if (prog.items.length) {
      it.innerHTML = "<strong>준비물</strong> · ";
      it.appendChild(document.createTextNode(prog.items.join(", ")));
    } else {
      it.textContent = "준비물을 입력하세요";
    }
    slide.appendChild(c);
  } else {
    const step = prog.steps[page - 1];
    const media = document.createElement("div");
    media.className = "step-media";
    if (step.img) {     // 그림 슬라이드(영상 없음): 사진·그림을 크게
      media.innerHTML = '<img class="stepimg" alt=""><div class="stepno"></div>';
      media.querySelector("img").src = clipUrl(step.img);
      media.querySelector(".stepno").textContent = step.label || ("활동 " + page);
    } else if (step.cho) {   // 초성 슬라이드(영상 없음): 검은 초성을 크게
      media.innerHTML = '<div class="bigword cho"></div><div class="stepno"></div>';
      const bw = media.querySelector(".bigword"), n = [...step.cho].length;
      bw.style.setProperty("--fs", "min(" + Math.min(30, 72 / n).toFixed(1) + "vw, 46vh)");
      [...step.cho].forEach(ch => { const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; bw.appendChild(s); });
      media.querySelector(".stepno").textContent = step.label || ("활동 " + page);
    } else if (step.word) {    // 글자 슬라이드(영상 없음): 앞 두 글자 + ○○ 를 크게
      media.innerHTML = '<div class="bigword"></div><div class="stepno"></div>';
      const bw = media.querySelector(".bigword");
      [...step.word].forEach(ch => { const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; bw.appendChild(s); });
      bw.insertAdjacentHTML("beforeend", '<span class="ring"></span><span class="ring"></span>');
      media.querySelector(".stepno").textContent = step.label || ("활동 " + page);
    } else {
    media.innerHTML =
      '<video autoplay loop muted playsinline></video>' +
      '<div class="stepno"></div>' +
      '<div class="no-clip"><strong>모션그래픽 자리</strong><span>아래 이름으로 파일을 넣어 주세요</span><code></code></div>';
    media.querySelector(".stepno").textContent = step.label || ("활동 " + page);
    const v = media.querySelector("video");
    v.onerror = () => {
      v.style.display = "none";
      media.querySelector("code").textContent = step.clip;
      media.querySelector(".no-clip").style.display = "flex";
    };
    v.src = clipUrl(step.clip);
    if (step.once) {    // 한 번만 재생: 끝의 흐려지는 부분 직전(마지막 문구가 보이는 화면)에서 멈춤
      v.loop = false;
      v.ontimeupdate = () => { if (v.duration && v.currentTime >= v.duration - 1.6) { v.pause(); v.ontimeupdate = null; } };
    }
    if (step.sound) {   // 효과음 영상: 소리 켜고 재생, 브라우저가 막으면 무음으로라도 재생
      v.muted = false;
      const p = v.play(); if (p) p.catch(() => { v.muted = true; v.play(); });
    }
    }
    const label = step.label || ("활동 " + page);

    const cap = document.createElement("div");
    cap.className = "caption" + (step.text ? "" : " placeholder");
    cap.textContent = step.text || label + " 설명을 입력하세요";

    slide.appendChild(media);
    slide.appendChild(cap);
  }

  // 진행 표시
  const dots = $("dots"); dots.innerHTML = "";
  for (let n = 0; n < total; n++) {
    const d = document.createElement("i");
    if (n === page) d.className = "on";
    dots.appendChild(d);
  }
  $("pageno").textContent = (page + 1) + " / " + total;

  // '다음 프로그램'은 같은 주차 안에서만: 1번째 → 2번째, 2번째가 끝나면 목록으로
  const last = page === total - 1;
  $("prevBtn").disabled = prog.order === 1 && page === 0;
  $("nextBtn").textContent = !last ? "다음 ▶" : prog.order === 1 ? "다음 프로그램 ▶" : "목록으로 ▶";
}

function next() {
  const prog = PROGRAMS[cur];
  if (page < totalPages(prog) - 1) { page++; renderSlide(); }
  else if (prog.order === 1) { cur++; page = 0; renderSlide(); }
  else backToMenu();
}
function prev() {
  if (page > 0) { page--; renderSlide(); }
  else if (PROGRAMS[cur].order === 2) { cur--; page = totalPages(PROGRAMS[cur]) - 1; renderSlide(); }
}

function backToMenu() {
  if (document.fullscreenElement) document.exitFullscreen();
  $("slide").querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
  $("show").classList.remove("on");
  $("menuView").style.display = "block";
  const card = $("prog" + cur);
  if (card) card.scrollIntoView({ block: "center" });
}

function toggleFull() {
  const el = $("show");
  if (document.fullscreenElement) document.exitFullscreen();
  else (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
}
document.addEventListener("fullscreenchange", () => {
  $("fullBtn").textContent = document.fullscreenElement ? "전체 화면 끄기" : "전체 화면";
});

$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;
$("backBtn").onclick = backToMenu;
$("fullBtn").onclick = toggleFull;
$("slide").onclick = next;   // 화면을 눌러도 다음으로

// 키보드 · 발표용 리모컨(클리커)
document.addEventListener("keydown", e => {
  if (!$("show").classList.contains("on")) return;
  const k = e.key;
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
  else if (k === "Home") { page = 0; renderSlide(); }
  else if (k === "f" || k === "F" || k === "F5") { e.preventDefault(); toggleFull(); }
  else if (k === "Escape" && !document.fullscreenElement) backToMenu();
});

renderMenu();
</script>
</body>
</html>
